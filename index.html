<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Mascotas</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <h1 class="titulo">Pelu</h1>
  <h2 class="subtitulo">Gestor de Mascotas</h2> 
  
  <div class="form-wrapper">  
    <form id="formMascota">
      <label>
        Nombre:
        <input type="text" id="nombre" required />
      </label>
      <label>
        Edad:
        <input type="number" id="edad" min="0" required />
      </label>
      <label>
        Tipo:
        <select id="tipo" required>
          <option value="">Selecciona</option>
          <option value="perro">Perro</option>
          <option value="gato">Gato</option>
        </select>
      </label>

      <!-- Radio buttons -->
      <fieldset>
        <legend>¿La mascota está vacunada?</legend>
        <label><input type="radio" name="vacunado" value="Sí" required /> Sí</label>
        <label><input type="radio" name="vacunado" value="No" /> No</label>
      </fieldset>

      <!-- Checkboxes -->
      <fieldset>
        <legend>¿Qué servicios ha recibido la mascota?</legend>
        <label><input type="checkbox" name="servicios" value="Vacunación"> Vacunación</label>
        <label><input type="checkbox" name="servicios" value="Esterilización"> Esterilización</label>
        <label><input type="checkbox" name="servicios" value="Desparasitación"> Desparasitación</label>
      </fieldset>

      <input type="hidden" id="id" />
      <button type="submit">Guardar Mascota</button>
    </form>
  </div>

  <div class="content">
    <h1 class="title-desktop">Pelu</h1>
    <h2 class="subtitle-desktop">Gestor de Mascotas</h2>
    <div id="listaMascotas"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
